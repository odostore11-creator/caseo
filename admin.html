<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Caseo Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe4;--ink:#15130f;--y:#ffd60a;--red:#ff5a36;--line:#15130f;--muted:#625e56}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(rgba(21,19,15,.1) 1.2px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:500 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wrap{width:min(1120px,calc(100% - 28px));margin:0 auto}
.muted{color:var(--muted)}
.hide{display:none!important}

/* shared look: thick borders + offset shadows, like the shop */
.box{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:2px solid var(--ink);background:var(--y);color:var(--ink);font-weight:700;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;text-decoration:none;font-size:14px}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.5;box-shadow:none;transform:none;cursor:not-allowed}
.btn.alt{background:#fff}
.btn.sm{padding:7px 14px;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
input,textarea{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 12px 1px;font-size:12px;font-weight:800;line-height:1.6;white-space:nowrap}
.s-new{background:var(--red);color:#fff}.s-confirmed{background:var(--y)}.s-printing{background:#8fd3ff}.s-shipped{background:#c4a8ff}.s-delivered{background:#6fdc96}.s-cancelled{background:#ddd;color:#555}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:min(400px,100%);text-align:center}
.logo{height:54px;display:block;margin:0 auto 6px}
#login h1{font-size:28px;margin:10px 0 4px}
#login form{margin-top:18px;text-align:left}
.msg{margin:12px 0 0;font-weight:700;color:var(--red);min-height:1.4em}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(243,239,228,.94);border-bottom:2px solid var(--ink);padding:max(10px,env(safe-area-inset-top)) 0 10px}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar .logo{margin:0;height:40px}
.bar h1{font-size:22px}
.bar .sp{flex:1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0 18px}
.stat{background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.stat.hot{background:var(--y)}

/* filters */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.chip.on{background:var(--y)}
.chip i{font-style:normal;opacity:.65;margin-left:6px}
.search{margin-bottom:18px}

/* order list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-bottom:20px}
.oc{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.oc:hover{transform:translate(-2px,-3px);box-shadow:8px 8px 0 var(--ink)}
.oc .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oc .top .when{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.oc .nm{font-size:17px;font-weight:800;letter-spacing:-.02em}
.oc .bot{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-weight:600}
.oc .bot b{color:var(--ink)}
.th{display:flex;gap:8px;align-items:center}
.th span,.th img{width:46px;height:56px;border:2px solid var(--ink);border-radius:10px;background:#e9e5dc;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;text-align:center;line-height:1.1;overflow:hidden}
.empty{text-align:center;padding:50px 0;color:var(--muted)}
.more{display:block;margin:0 auto 40px}

/* detail modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(21,19,15,.55);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.modal.on{display:flex}
.mb{background:var(--paper);border:2px solid var(--ink);border-radius:26px;width:min(760px,100%);padding:24px;position:relative;margin:auto}
.mx{position:absolute;top:10px;right:16px;background:none;border:0;font-size:32px;line-height:1}
.mb h2{font-size:28px;margin-bottom:4px}
.sec{margin-top:18px}
.sec>h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1.5px solid rgba(21,19,15,.18)}
.row small{display:block;color:var(--muted);font-weight:600}
.row:last-child{border:0}
.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;word-break:break-word}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sts{display:flex;gap:8px;flex-wrap:wrap}
.sts .chip.on{box-shadow:none;transform:translate(2px,2px)}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.imgs a{display:block;width:120px;height:150px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#e9e5dc;font-size:12px;font-weight:700;text-align:center;padding-top:60px}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0 8px 18px;border-left:3px solid var(--ink);position:relative;margin-left:6px}
.hist li::before{content:"";position:absolute;left:-8px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--y);border:2px solid var(--ink)}
.hist small{display:block;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.mb{padding:18px;border-radius:20px}.kv{grid-template-columns:84px 1fr}.bar h1{font-size:18px}.bar .logo{height:34px}}
</style>
</head>

<div class="modal" id="modal"><div class="mb" id="mb"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== CONFIG: paste your Worker link (no slash at the end) and the same image link you use in index.html ===== */
var CFG={
  API:"",                 /* e.g. "https://caseo-api.yourname.workers.dev" */
  IMG_BASE:"https://caseo-images.omardirty999.workers.dev/"      /* same as IMG_BASE in index.html, e.g. "https://caseo-images.yourname.workers.dev/" */
};
var STATUS=[["new","New"],["confirmed","Confirmed"],["printing","Printing"],["shipped","Shipped"],["delivered","Delivered"],["cancelled","Cancelled"]];
var SLABEL={};STATUS.forEach(function(s){SLABEL[s[0]]=s[1];});

var $=function(i){return document.getElementById(i);};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(n){return "EGP "+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});}
function ago(t){var s=Math.max(0,(Date.now()-t)/1000);if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";if(s<604800)return Math.floor(s/86400)+" d ago";return new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
function when(t){return new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function pad(i){return (i<9?"0":"")+(i+1);}
function waNum(n){var d=String(n||"").replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);else if(d.charAt(0)==="0")d="20"+d.slice(1);return d;}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},2600);}

/* ===== session ===== */
var tok=null;
try{var sv=JSON.parse(localStorage.getItem("caseo_admin")||"null");if(sv&&sv.t&&sv.exp>Date.now()/1000)tok=sv.t;}catch(e){}
function setTok(t,exp){tok=t;try{if(t)localStorage.setItem("caseo_admin",JSON.stringify({t:t,exp:exp}));else localStorage.removeItem("caseo_admin");}catch(e){}}
function show(){var on=!!tok;$("login").classList.toggle("hide",on);$("app").classList.toggle("hide",!on);if(on){loadAll();}else{$("pw").focus();}}
function out(){setTok(null);$("modal").classList.remove("on");show();}

function api(path,opt){opt=opt||{};var h={};if(tok)h.Authorization="Bearer "+tok;if(opt.body)h["Content-Type"]="application/json";
 return fetch(CFG.API+path,{method:opt.method||"GET",headers:h,body:opt.body}).then(function(r){
  if(r.status===401&&tok){out();throw new Error("Signed out");}
  if(opt.blob)return r.ok?r.blob():Promise.reject(new Error("File not found"));
  return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Something went wrong");return j;});});}

$("loginForm").addEventListener("submit",function(e){e.preventDefault();var b=$("loginBtn"),m=$("loginMsg");m.textContent="";
 if(!CFG.API){m.textContent="Set CFG.API at the top of admin.html first.";return;}
 b.disabled=true;b.textContent="Signing in…";
 api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("pw").value})}).then(function(j){$("pw").value="";setTok(j.token,j.exp);show();})
 .catch(function(err){m.textContent=err.message==="Failed to fetch"?"Can't reach the server. Check your connection.":err.message;})
 .then(function(){b.disabled=false;b.textContent="Sign in";});});
$("logout").onclick=out;

/* ===== list ===== */
var st={status:"",q:"",orders:[],more:false,counts:{},sums:{},seenNew:null};
function loadStats(quiet){return api("/api/admin/stats").then(function(j){
  var n=j.counts.new||0;if(quiet&&st.seenNew!==null&&n>st.seenNew)toast("New order received");st.seenNew=n;
  st.counts=j.counts;st.sums=j.sums;drawStats();document.title=(n?"("+n+") ":"")+"Caseo Admin";});}
function drawStats(){var c=st.counts,s=st.sums,all=0,rev=0;STATUS.forEach(function(x){all+=c[x[0]]||0;if(x[0]!=="cancelled")rev+=s[x[0]]||0;});
 $("stats").innerHTML='<div class="stat'+((c["new"]||0)?' hot':'')+'"><small>New</small><b>'+(c["new"]||0)+'</b></div>'+
  '<div class="stat"><small>In progress</small><b>'+((c.confirmed||0)+(c.printing||0))+'</b></div>'+
  '<div class="stat"><small>Shipped</small><b>'+(c.shipped||0)+'</b></div>'+
  '<div class="stat"><small>Delivered</small><b>'+(c.delivered||0)+'</b></div>'+
  '<div class="stat"><small>Sales (not cancelled)</small><b style="font-size:22px;padding-top:5px">'+fmt(rev)+'</b></div>';
 $("chips").innerHTML='<button class="chip'+(st.status===""?' on':'')+'" data-s="">All<i>'+all+'</i></button>'+STATUS.map(function(x){return '<button class="chip'+(st.status===x[0]?' on':'')+'" data-s="'+x[0]+'">'+x[1]+'<i>'+(c[x[0]]||0)+'</i></button>';}).join("");}
function thumbs(items){var h=(items||[]).slice(0,4).map(function(it){return it.i===-1?'<span>Custom</span>':'<img alt="" loading="lazy" src="'+esc(CFG.IMG_BASE)+'design-'+pad(it.i)+'.webp" onerror="this.style.visibility=\'hidden\'">';}).join("");
 if((items||[]).length>4)h+='<span>+'+(items.length-4)+'</span>';return h;}
function card(o){var n=o.items.reduce(function(s,i){return s+i.q;},0);
 return '<button class="oc" data-ref="'+esc(o.ref)+'"><div class="top"><b>'+esc(o.ref)+'</b><span class="pill s-'+esc(o.status)+'">'+esc(SLABEL[o.status]||o.status)+'</span><span class="when">'+ago(o.created_at)+'</span></div>'+
  '<div class="nm">'+esc(o.name)+' <span class="muted" style="font-weight:600">· '+esc(o.city)+'</span></div><div class="th">'+thumbs(o.items)+'</div>'+
  '<div class="bot"><span>'+n+(n===1?' item':' items')+' · '+esc(o.payment||"")+'</span><b>'+fmt(o.total)+'</b></div></button>';}
function drawList(){$("list").innerHTML=st.orders.length?st.orders.map(card).join(""):"";if(!st.orders.length)$("list").innerHTML='<p class="empty" style="grid-column:1/-1">No orders here yet.</p>';$("more").classList.toggle("hide",!st.more);}
function loadList(append){var q="/api/admin/orders?offset="+(append?st.orders.length:0)+(st.status?"&status="+st.status:"")+(st.q?"&q="+encodeURIComponent(st.q):"");
 return api(q).then(function(j){st.orders=append?st.orders.concat(j.orders):j.orders;st.more=j.more;drawList();});}
function loadAll(quiet){return Promise.all([loadStats(quiet),loadList(false)]).catch(function(e){if(e.message!=="Signed out")toast(e.message==="Failed to fetch"?"Can't reach the server":e.message);});}
$("chips").addEventListener("click",function(e){var b=e.target.closest("[data-s]");if(!b)return;st.status=b.getAttribute("data-s");drawStats();loadList(false).catch(function(e){toast(e.message);});});
var sd;$("search").addEventListener("input",function(){clearTimeout(sd);sd=setTimeout(function(){st.q=$("search").value.trim();loadList(false).catch(function(e){toast(e.message);});},300);});
$("more").onclick=function(){loadList(true).catch(function(e){toast(e.message);});};
$("refresh").onclick=function(){loadAll().then(function(){toast("Updated");});};
$("list").addEventListener("click",function(e){var b=e.target.closest("[data-ref]");if(b)openOrder(b.getAttribute("data-ref"));});
setInterval(function(){if(tok&&!document.hidden&&!$("modal").classList.contains("on")&&!st.q)loadAll(true);},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&tok&&!$("modal").classList.contains("on"))loadAll(true);});

/* ===== order detail ===== */
var blobs=[];
function closeM(){$("modal").classList.remove("on");blobs.forEach(function(u){URL.revokeObjectURL(u);});blobs=[];}
$("modal").addEventListener("click",function(e){if(e.target===$("modal")||e.target.id==="mx")closeM();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM();});
function openOrder(ref){$("mb").innerHTML='<button class="mx" id="mx" aria-label="Close">&times;</button><p class="muted">Loading…</p>';$("modal").classList.add("on");
 api("/api/admin/orders/"+encodeURIComponent(ref)).then(function(j){drawOrder(j.order,j.history);}).catch(function(e){$("mb").innerHTML='<button class="mx" id="mx" aria-label="Close">&times;</button><p class="msg">'+esc(e.message)+'</p>';});}
function drawOrder(o,hist){var sc=$("mb").scrollTop;blobs.forEach(function(u){URL.revokeObjectURL(u);});blobs=[];
 var num=waNum(o.whatsapp||o.phone),wa="https://wa.me/"+num+"?text="+encodeURIComponent("Hi "+o.name+", this is Caseo about your order "+o.ref+".");
 var items=o.items.map(function(it){var nm=it.i===-1?"Custom design":esc(it.n)+" #"+pad(it.i);
  return '<div class="row"><span><b>'+nm+'</b><small>'+esc(it.kn)+', '+esc(it.m)+', x'+it.q+'</small></span><span>'+fmt(it.unit*it.q)+'</span></div>';}).join("");
 var customs=o.items.filter(function(it){return it.u;}),noimg=o.items.some(function(it){return it.i===-1&&!it.u;});
 var imgs=customs.length?'<div class="sec"><h3>Custom design images</h3><div class="imgs">'+customs.map(function(it){return '<a href="#" data-file="'+esc(it.u)+'" target="_blank" rel="noopener">Loading…</a>';}).join("")+'</div><p class="muted" style="margin:8px 0 0;font-size:13px">Tap an image to open it full size.</p></div>':"";
 $("mb").innerHTML='<button class="mx" id="mx" aria-label="Close">&times;</button>'+
  '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>'+esc(o.ref)+'</h2><span class="pill s-'+esc(o.status)+'">'+esc(SLABEL[o.status]||o.status)+'</span></div>'+
  '<p class="muted" style="margin:2px 0 0">Placed '+when(o.created_at)+(o.rev?' · edited by customer '+o.rev+'x, last '+ago(o.updated_at):'')+'</p>'+
  '<div class="sec"><h3>Status</h3><div class="sts">'+STATUS.map(function(s){return '<button class="chip'+(s[0]===o.status?' on':'')+'" data-set="'+s[0]+'">'+s[1]+'</button>';}).join("")+'</div>'+
  '<input id="stNote" placeholder="Note for the history (optional)" maxlength="300" style="margin-top:10px"></div>'+
  '<div class="sec"><h3>Customer</h3><dl class="kv"><dt>Name</dt><dd><b>'+esc(o.name)+'</b></dd><dt>Phone</dt><dd>'+esc(o.phone)+'</dd><dt>WhatsApp</dt><dd>'+esc(o.whatsapp||"-")+'</dd>'+(o.email?'<dt>Email</dt><dd>'+esc(o.email)+'</dd>':'')+'<dt>Address</dt><dd>'+esc(o.address)+'<br>'+esc(o.city)+'</dd><dt>Payment</dt><dd>'+esc(o.payment||"-")+'</dd>'+(o.notes?'<dt>Notes</dt><dd>'+esc(o.notes)+'</dd>':'')+'</dl>'+
  '<div class="acts"><a class="btn sm" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a><a class="btn alt sm" href="tel:'+esc(String(o.phone).replace(/[^\d+]/g,""))+'">Call</a><button class="btn alt sm" data-copy="'+esc(o.name+"\n"+o.phone+"\n"+o.address+", "+o.city)+'" type="button">Copy address</button></div></div>'+
  '<div class="sec"><h3>Items</h3>'+items+'<div class="row"><span>Delivery</span><span>Free</span></div><div class="row" style="font-size:17px"><b>Total</b><b>'+fmt(o.total)+'</b></div>'+
  (noimg?'<p class="note" style="margin:8px 0 0;background:#fff3b0;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:13px">A custom design here has no uploaded image. Ask the customer to send it on WhatsApp.</p>':'')+'</div>'+imgs+
  '<div class="sec"><h3>Your private note</h3><textarea id="adNote" rows="3" maxlength="1000" placeholder="Only you can see this">'+esc(o.admin_note||"")+'</textarea><div class="acts"><button class="btn sm" data-savenote type="button">Save note</button></div></div>'+
  '<div class="sec"><h3>History</h3><ul class="hist">'+hist.map(function(h){return '<li><b>'+esc(SLABEL[h.status]||h.status)+'</b>'+(h.note?' · '+esc(h.note):'')+'<small>'+when(h.at)+'</small></li>';}).join("")+'</ul></div>'+
  '<div class="sec"><button class="btn alt sm red" data-del type="button" style="color:#fff">Delete this order</button></div>';
 $("mb").setAttribute("data-ref",o.ref);$("mb").scrollTop=sc;
 [].forEach.call($("mb").querySelectorAll("[data-file]"),function(a){api("/api/admin/file?key="+encodeURIComponent(a.getAttribute("data-file")),{blob:true}).then(function(b){var u=URL.createObjectURL(b);blobs.push(u);a.href=u;a.style.padding="0";a.innerHTML='<img alt="Custom design" src="'+u+'">';}).catch(function(){a.textContent="Image missing";a.removeAttribute("href");});});}
$("mb").addEventListener("click",function(e){var ref=$("mb").getAttribute("data-ref"),t;
 if((t=e.target.closest("[data-file]"))&&!t.getAttribute("href"))e.preventDefault();
 if((t=e.target.closest("[data-set]"))){var s=t.getAttribute("data-set");if(s==="cancelled"&&!confirm("Mark this order as cancelled?"))return;
  api("/api/admin/orders/"+ref+"/status",{method:"POST",body:JSON.stringify({status:s,note:$("stNote").value})}).then(function(){toast("Status: "+SLABEL[s]);return api("/api/admin/orders/"+ref);}).then(function(j){drawOrder(j.order,j.history);loadAll();}).catch(function(e){toast(e.message);});return;}
 if((t=e.target.closest("[data-savenote]"))){api("/api/admin/orders/"+ref+"/note",{method:"POST",body:JSON.stringify({note:$("adNote").value})}).then(function(){toast("Note saved");}).catch(function(e){toast(e.message);});return;}
 if((t=e.target.closest("[data-copy]"))){try{navigator.clipboard.writeText(t.getAttribute("data-copy"));toast("Copied");}catch(x){toast("Couldn't copy");}return;}
 if(e.target.closest("[data-del]")){if(!confirm("Delete order "+ref+" for good? This cannot be undone."))return;
  api("/api/admin/orders/"+ref,{method:"DELETE"}).then(function(){closeM();toast("Order deleted");loadAll();}).catch(function(e){toast(e.message);});}});

show();
</script>
</body>
</html>
